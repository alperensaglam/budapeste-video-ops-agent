# ─────────────────────────────────────────────────────────────────────────────
# h200-prod — Organizasyonun yarışma çıkarım altyapısı (8× NVIDIA H200).
#
# Final performans sayıları BU profilde ölçülüp raporlanır (RTF, TTFT, tok/s,
# tepe VRAM). Şartname Bölüm 4: "Video işleme süresi, model inference süresi,
# bellek ve donanım kullanımı ... önemli değerlendirme kriterleri arasındadır."
#
# L3 bu fazda resmi OpenAI-uyumlu uç noktadaki Slot B'yi kullanır. Gerçek model
# organizasyon tarafından seçilir; uygulamanın bağlandığı kararlı ad ``vlm``dir.
# Uç nokta ve takıma özel anahtar repoya yazılmaz, ortamdan okunur.
# ─────────────────────────────────────────────────────────────────────────────
name: h200-prod
description: "Resmi H200 çıkarım altyapısı. Slot B (vlm), BF16 ve guided JSON."

cassette_dir: data/cassettes
cassette_mode: passthrough    # gerçek koşu; kaset devre dışı

vlm:
  backend: vllm
  model: vlm                  # Slot B erişim adı; fiziksel model adına bağlanma
  base_url: ""
  base_url_env: TEKNOFEST_INFERENCE_BASE_URL
  api_key_env: TEKNOFEST_API_KEY
  dtype: bfloat16             # resmi altyapıda nicelemesiz BF16
  max_model_len: 65536
  guided_json: true
  enable_prefix_caching: true # uzun video bağlamı turlar arası paylaşılır
  max_concurrency: 2
  request_timeout_s: 120.0

planner:
  backend: vllm
  model: Qwen/Qwen3-8B
  base_url: http://localhost:8001/v1
  max_tokens: 2048

sampling:
  base_fps: 2.0
  max_frames_per_segment: 16
  max_frames_total: 128
  zoom_fps: 8.0
  segment_seconds: 8.0
  adaptive: true

perception:
  device: cuda
  detector: rtdetrv2_r50
  detector_conf: 0.30
  enable_pose: true
  enable_asr: true
  asr_model: large-v3
  asr_compute_type: float16
  enable_audio_events: true
  max_video_seconds: 3600.0   # vardiya raporu senaryosu (1 saatlik kayıt)

agent:
  max_turns: 20
  max_tool_calls_per_turn: 10
  enable_verifier: true
  support_threshold: 0.55
  enable_zoom_loop: true
  max_zoom_iterations: 3
  enable_clarifying_questions: true
  enable_episodic_memory: true
  enable_sop_rag: true
  require_confirmation_for_irreversible: true
  tool_retry_max: 3

faults:
  enabled: false
