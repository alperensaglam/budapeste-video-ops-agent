# GÖZCÜ CI — GPU GEREKTİRMEZ.
#
# Tüm testler cpu-dev profilinde, kasetten oynatma ile koşar. Bu, ekibin dört
# üyesinin de GPU'suz çalışabilmesini garanti eden mekanizmanın CI karşılığıdır.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GOZCU_PROFILE: cpu-dev
  PYTHONIOENCODING: utf-8

jobs:
  kalite:
    name: Kalite kapıları (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff + mypy)
        run: python tasks.py lint

      - name: Testler
        run: python tasks.py test

      - name: Sözleşme kararlılığı
        run: python tasks.py schema-check

      - name: Lisans hijyeni (Apache-2.0 uyumu)
        run: python tasks.py license-check

  kapsam:
    name: Test kapsamı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Kapsam raporu
        run: python tasks.py cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kapsam-raporu
          path: htmlcov/
          retention-days: 14
